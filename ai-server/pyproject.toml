[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logfolio-ai"
version = "0.1.0"
description = "Evidence-grounded AI analysis server for LogFolio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.116,<1.0",
    "google-genai>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.8,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
]
embedding = [
    "sentence-transformers>=3.0,<6.0",
]

[project.scripts]
logfolio-ai = "logfolio_ai.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/logfolio_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
