[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logfolio-ai"
version = "0.1.0"
description = "Evidence-grounded AI analysis server for LogFolio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/logfolio_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
