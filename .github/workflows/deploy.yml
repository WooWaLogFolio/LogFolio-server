name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/woowalogfolio/logfolio-backend
  AI_IMAGE: ghcr.io/woowalogfolio/logfolio-ai
  GEMINI_MODEL: gemini-3.8-flash
  GEMINI_FALLBACK_MODEL: gemini-3.6-flash

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-server
          file: ./ai-server/Dockerfile
          build-args: |
            INSTALL_EMBEDDING=true
          push: true
          tags: ${{ env.AI_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cleanup must happen before SCP as a completely full host cannot even
      # receive the small deployment archive.
      - name: Free EC2 disk space before deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -u
            echo "Disk usage before cleanup:"
            df -h /

            # Docker/Containerd GC also needs a small amount of free space to
            # update its metadata. Reclaim OS-managed caches first so GC can
            # run even when the root filesystem starts completely full.
            sudo -n journalctl --vacuum-size=50M || true
            sudo -n apt-get clean || true

            # Preserve running services and every named volume (notably the
            # PostgreSQL volume). Only stopped containers, build cache, and
            # images unused by running containers are eligible for deletion.
            docker container prune -f || true
            docker builder prune -af || true
            docker image prune -af || true

            echo "Disk usage after cleanup:"
            df -h /

      # Keep version-controlled runtime files in sync without ever copying .env,
      # which contains production-only secrets on the EC2 instance.
      - name: Sync deployment configuration to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,ai-server/migrations,ai-server/scripts/apply_migrations.sh"
          target: /opt/logfolio

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/logfolio/deploy
            export IMAGE_TAG=${{ github.sha }}
            # Keep the production model version-controlled. An exported value
            # takes precedence over the older GEMINI_MODEL in the EC2 .env.
            export GEMINI_MODEL=${{ env.GEMINI_MODEL }}
            export GEMINI_FALLBACK_MODEL=${{ env.GEMINI_FALLBACK_MODEL }}
            # Free old, unused image layers before pulling the next release.
            # Running containers and named volumes (including PostgreSQL data)
            # are preserved. Pruning only after deployment is too late when the
            # host has no room to extract the incoming image.
            docker image prune -af
            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml run --rm ai-migrate
            docker compose --env-file .env -f docker-compose.prod.yml up -d --wait --remove-orphans
            docker image prune -f
